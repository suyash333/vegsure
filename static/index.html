<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VegScan</title>
  <meta name="description" content="Scan a food barcode, QR code or ingredient list and see which ingredients aren't vegetarian or vegan.">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1><span class="logo" aria-hidden="true">🌿</span> VegScan</h1>
    <button id="diet-button" class="diet-chip" type="button" aria-label="Change diet">Vegetarian</button>
  </header>
  <main id="app"></main>
  <noscript><p style="padding:16px">VegScan needs JavaScript to scan and check ingredients.</p></noscript>
</body>
</html>
